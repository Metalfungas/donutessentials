<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Donut Essentials - Downloads</title>

<style>
:root{
  --bg1:#0b0202;
  --bg2:#1a0605;
  --red:#ff4d2e;
  --orange:#ff9a2f;
  --text:#fff3ea;
  --border:rgba(255,160,80,0.2);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  overflow:hidden;
  color:var(--text);

  background:
    radial-gradient(circle at 15% 20%, rgba(255,77,46,0.25), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(255,154,47,0.18), transparent 45%),
    radial-gradient(circle at 50% 85%, rgba(255,60,30,0.12), transparent 50%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* CANVAS LAYERS */
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* UI */
.wrap{
  position:relative;
  z-index:3;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:min(1000px,100%);
  padding:40px;
  border-radius:24px;
  border:1px solid var(--border);
  backdrop-filter:blur(16px);
  background:rgba(255,255,255,0.06);
  text-align:center;
}

h1{
  margin:0;
  font-size:3rem;
  background:linear-gradient(90deg,var(--orange),var(--red));
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  opacity:0.7;
  letter-spacing:0.2em;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:20px;
}

.mod{
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.25);
  transition:0.25s;
}

.mod:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 0 30px rgba(255,100,40,0.15);
}

.mod img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.mod .info{
  padding:12px;
  font-weight:700;
}

/* LOADER */
.loader{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:7px;
  background:rgba(255,255,255,0.06);
  z-index:10;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--red),var(--orange));
  box-shadow:0 0 20px rgba(255,120,40,0.6);
  transition:width 0.1s linear;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- particle layers -->
<canvas id="sparks"></canvas>
<canvas id="smoke"></canvas>

<div class="wrap">
  <div class="card">
    <h1>Downloads</h1>
    <div class="sub">DONUT ESSENTIALS</div>

    <div class="grid">
      <div class="mod" onclick="downloadFile('file1.zip')">
        <img src="https://picsum.photos/400/200?1">
        <div class="info">PvP Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('file2.zip')">
        <img src="https://picsum.photos/400/200?2">
        <div class="info">FPS Boost</div>
      </div>

      <div class="mod" onclick="downloadFile('file3.zip')">
        <img src="https://picsum.photos/400/200?3">
        <div class="info">Client Mods</div>
      </div>

      <div class="mod" onclick="downloadFile('file4.zip')">
        <img src="https://picsum.photos/400/200?4">
        <div class="info">HUD Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('file5.zip')">
        <img src="https://picsum.photos/400/200?5">
        <div class="info">Utility Mods</div>
      </div>
    </div>
  </div>
</div>

<div class="loader"><div class="bar" id="bar"></div></div>

<script>
const bar=document.getElementById("bar");

/* DOWNLOAD */
function downloadFile(file){
  let p=0;
  bar.style.width="0%";

  const int=setInterval(()=>{
    p+=Math.random()*10;

    if(p>=100){
      p=100;
      clearInterval(int);

      const a=document.createElement("a");
      a.href=file;
      a.download=file;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=>bar.style.width="0%",600);
    }

    bar.style.width=p+"%";
  },70);
}

/* ===== EMBER PARTICLES ===== */
const c=document.getElementById("sparks");
const ctx=c.getContext("2d");

let w,h,p=[],mouse={x:0,y:0};

function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}

window.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

function particle(){
  return{
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-0.5)*1.6,
    vy:(Math.random()-0.5)*1.6,
    r:Math.random()*2.5,
    color:Math.random()>0.5
      ? "rgba(255,77,46,0.8)"
      : "rgba(255,154,47,0.8)"
  };
}

function init(){
  p=[];
  for(let i=0;i<160;i++) p.push(particle());
}

function draw(){
  ctx.clearRect(0,0,w,h);

  for(let i of p){

    // mouse attraction
    let dx=i.x-mouse.x;
    let dy=i.y-mouse.y;
    let dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<140){
      i.x+=dx*0.01;
      i.y+=dy*0.01;
    }

    i.x+=i.vx;
    i.y+=i.vy;

    if(i.x<0||i.x>w||i.y<0||i.y>h){
      Object.assign(i,particle());
    }

    ctx.shadowBlur=12;
    ctx.shadowColor=i.color;
    ctx.fillStyle=i.color;

    ctx.beginPath();
    ctx.arc(i.x,i.y,i.r,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

window.onresize=()=>{resize();init();}
resize();init();draw();


/* ===== SMOKE LAYER ===== */
const s=document.getElementById("smoke");
const sx=s.getContext("2d");

let sw,sh,sm=[];

function resizeS(){
  sw=s.width=innerWidth;
  sh=s.height=innerHeight;
}

function smoke(){
  return{
    x:Math.random()*sw,
    y:Math.random()*sh,
    r:Math.random()*120+60,
    a:Math.random()*0.03
  };
}

function initS(){
  sm=[];
  for(let i=0;i<25;i++) sm.push(smoke());
}

function drawS(){
  sx.clearRect(0,0,sw,sh);

  for(let i of sm){
    sx.fillStyle="rgba(255,120,60,0.02)";
    sx.beginPath();
    sx.arc(i.x,i.y,i.r,0,Math.PI*2);
    sx.fill();

    i.y-=0.2;
    if(i.y<-100) i.y=sh+100;
  }

  requestAnimationFrame(drawS);
}

window.addEventListener("resize",()=>{
  resizeS();initS();
});

resizeS();initS();drawS();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Donut Essentials - Downloads</title>

<style>
:root{
  --bg1:#120606;
  --bg2:#250b08;
  --red:#ff4d2e;
  --orange:#ff9a2f;
  --text:#fff3ea;
  --border:rgba(255,160,80,0.2);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,154,47,0.15), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(255,77,46,0.12), transparent 35%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* sparks */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:2;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:min(1000px,100%);
  padding:40px;
  border-radius:24px;
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  background:rgba(255,255,255,0.06);
  text-align:center;
}

h1{
  margin:0;
  font-size:3rem;
  background:linear-gradient(90deg,var(--orange),var(--red));
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  opacity:0.7;
  letter-spacing:0.2em;
  margin-bottom:20px;
}

/* GRID CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:20px;
}

.mod{
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.25);
  transition:0.2s;
}

.mod:hover{
  transform:translateY(-4px);
}

.mod img{
  width:100%;
  height:120px;
  object-fit:cover;
  display:block;
}

.mod .info{
  padding:12px;
  font-weight:700;
}

/* LOADING BAR */
.loader{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:7px;
  background:rgba(255,255,255,0.06);
  z-index:5;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--red),var(--orange));
  box-shadow:0 0 20px rgba(255,120,40,0.6);
  transition:width 0.1s linear;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<canvas id="sparks"></canvas>

<div class="wrap">
  <div class="card">
    <h1>Downloads</h1>
    <div class="sub">DONUT ESSENTIALS</div>

    <div class="grid">

      <div class="mod" onclick="downloadFile('file1.zip')">
        <img src="https://picsum.photos/400/200?1">
        <div class="info">PvP Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('file2.zip')">
        <img src="https://picsum.photos/400/200?2">
        <div class="info">FPS Boost</div>
      </div>

      <div class="mod" onclick="downloadFile('file3.zip')">
        <img src="https://picsum.photos/400/200?3">
        <div class="info">Client Mods</div>
      </div>

      <div class="mod" onclick="downloadFile('file4.zip')">
        <img src="https://picsum.photos/400/200?4">
        <div class="info">HUD Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('file5.zip')">
        <img src="https://picsum.photos/400/200?5">
        <div class="info">Utility Mods</div>
      </div>

    </div>
  </div>
</div>

<!-- loading bar -->
<div class="loader"><div class="bar" id="bar"></div></div>

<script>
const bar = document.getElementById("bar");

function downloadFile(file){
  let progress = 0;
  bar.style.width = "0%";

  // fake progress animation
  const interval = setInterval(() => {
    progress += Math.random()*12;
    if(progress >= 100){
      progress = 100;
      clearInterval(interval);

      // trigger real download
      const a = document.createElement("a");
      a.href = file;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=> bar.style.width="0%", 600);
    }

    bar.style.width = progress + "%";
  }, 80);
}

/* sparks background */
const c=document.getElementById("sparks");
const ctx=c.getContext("2d");

let w,h,p=[];

function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}

function s(){
  return{
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-0.5)*1.2,
    vy:(Math.random()-0.5)*1.2,
    r:Math.random()*2
  };
}

function init(){
  p=[];
  for(let i=0;i<80;i++) p.push(s());
}

function draw(){
  ctx.clearRect(0,0,w,h);

  for(let i of p){
    i.x+=i.vx;
    i.y+=i.vy;

    if(i.x<0||i.x>w||i.y<0||i.y>h){
      Object.assign(i,s());
    }

    ctx.fillStyle="rgba(255,140,60,0.7)";
    ctx.beginPath();
    ctx.arc(i.x,i.y,i.r,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

window.onresize=()=>{resize();init();}
resize();init();draw();
</script>

</body>
</html>

*{box-sizing:border-box;}

.card{

h1{

  color:transparent;
}

.sub{

  margin-bottom:22px;

  letter-spacing:0.28em;
  font-size:0.82rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:14px;
  margin-top:18px;
}

.mod{
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,190,80,0.16);
  background:rgba(0,0,0,0.22);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  min-height:200px;
}
.mod:hover{
  transform:translateY(-5px);
  box-shadow:0 16px 40px rgba(255,160,40,0.16);
  border-color:rgba(255,210,120,0.3);
}

  .discord-btn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(20,10,5,0.75);
  border:1px solid rgba(255,170,80,0.25);
  color:#fff4ef;
  text-decoration:none;
  font-weight:700;
  backdrop-filter:blur(10px);

  z-index:10;
}

.discord-btn:hover{
  transform:translateX(-50%) translateY(-3px);

}

.discord-btn img{
  width:20px;

}
.mod img{

.mod .info{

  font-size:14px;

  white-space:nowrap;
  overflow:hidden;

/* loading bar */
.loader{

  left:0;
  bottom:0;
  width:100%;
  height:7px;
  z-index:5;

.bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--red),var(--pink),var(--orange));
  box-shadow:0 0 18px rgba(255,170,60,0.65);

}

@media (max-width: 850px){
  body{

    align-items:flex-start;
    padding-top:26px;
    padding-bottom:26px;
  }
  .grid{
    grid-template-columns:1fr;
  }

<script>
const bar = document.getElementById("bar");

function downloadFile(file){
  let progress = 0;
  bar.style.width = "0%";

  const interval = setInterval(() => {
    progress += Math.random() * 10 + 2;

    if(progress >= 100){
      progress = 100;
      clearInterval(interval);

      const a = document.createElement("a");
      a.href = file;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => {
        bar.style.width = "0%";
      }, 500);
    }

    bar.style.width = progress + "%";
  }, 65);
}

/* =========================
   MOVING GLOW BACKGROUND
========================= */
const bg = document.getElementById("bg");
const bgCtx = bg.getContext("2d");
let bw = 0, bh = 0, bd = 1;

function resizeBg(){
  bd = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  bw = window.innerWidth;
  bh = window.innerHeight;
  bg.width = Math.floor(bw * bd);
  bg.height = Math.floor(bh * bd);
  bg.style.width = bw + "px";
  bg.style.height = bh + "px";
  bgCtx.setTransform(bd, 0, 0, bd, 0, 0);
}
window.addEventListener("resize", resizeBg);
resizeBg();

function drawBg(t){
  const time = t * 0.001;

  const base = bgCtx.createLinearGradient(0, 0, bw, bh);
  base.addColorStop(0, "#090204");
  base.addColorStop(0.5, "#140306");
  base.addColorStop(1, "#0c0205");
  bgCtx.fillStyle = base;
  bgCtx.fillRect(0, 0, bw, bh);

  const blobs = [
    {x: 0.2, y: 0.25, r: 0.30, c1: "rgba(255, 122, 24, 0.38)", c2: "rgba(255, 122, 24, 0)"},
    {x: 0.78, y: 0.28, r: 0.34, c1: "rgba(255, 179, 71, 0.30)", c2: "rgba(255, 179, 71, 0)"},
    {x: 0.52, y: 0.72, r: 0.42, c1: "rgba(255, 209, 102, 0.25)", c2: "rgba(255, 209, 102, 0)"},
    {x: 0.35, y: 0.82, r: 0.28, c1: "rgba(255, 160, 40, 0.22)", c2: "rgba(255, 160, 40, 0)"}
  ];

  for(let i = 0; i < blobs.length; i++){
    const b = blobs[i];
    const px = bw * (b.x + Math.sin(time * 0.35 + i * 1.7) * 0.05);
    const py = bh * (b.y + Math.cos(time * 0.28 + i * 1.3) * 0.05);
    const radius = Math.min(bw, bh) * b.r;

    const g = bgCtx.createRadialGradient(px, py, 0, px, py, radius);
    g.addColorStop(0, b.c1);
    g.addColorStop(0.45, b.c1.replace(/[\d.]+\)$/,'0.16)'));
    g.addColorStop(1, b.c2);

    bgCtx.fillStyle = g;
    bgCtx.beginPath();
    bgCtx.arc(px, py, radius, 0, Math.PI * 2);
    bgCtx.fill();
  }

  const haze = bgCtx.createRadialGradient(
    bw * 0.5, bh * 0.5, Math.min(bw, bh) * 0.15,
    bw * 0.5, bh * 0.5, Math.max(bw, bh) * 0.8
  );
  haze.addColorStop(0, "rgba(255,255,255,0)");
  haze.addColorStop(1, "rgba(0,0,0,0.42)");
  bgCtx.fillStyle = haze;
  bgCtx.fillRect(0, 0, bw, bh);

  requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);

/* =========================
   SPARK PARTICLES
========================= */
const sparks = document.getElementById("sparks");
const sCtx = sparks.getContext("2d");
let sw = 0, sh = 0, sp = [];
const mouse = { x: -9999, y: -9999 };

function resizeSparks(){
  const d = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  sw = window.innerWidth;
  sh = window.innerHeight;
  sparks.width = Math.floor(sw * d);
  sparks.height = Math.floor(sh * d);
  sparks.style.width = sw + "px";
  sparks.style.height = sh + "px";
  sCtx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", resizeSparks);
resizeSparks();

window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function makeSpark(){
  const r = Math.random();
  const color = r < 0.34
    ? "rgba(255,122,24,0.82)"
    : r < 0.67
      ? "rgba(255,179,71,0.82)"
      : "rgba(255,209,102,0.82)";

  return {
    x: Math.random() * sw,
    y: Math.random() * sh,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5,
    r: Math.random() * 2.3 + 0.4,
    color
  };
}

function initSparks(){
  sp = [];
  for(let i = 0; i < 170; i++) sp.push(makeSpark());
}
initSparks();

function drawSparks(){
  sCtx.clearRect(0, 0, sw, sh);

  for(const s of sp){
    const dx = s.x - mouse.x;
    const dy = s.y - mouse.y;
    const dist = Math.hypot(dx, dy);

    if(dist < 160){
      s.x += dx * 0.008;
      s.y += dy * 0.008;
    }

    s.x += s.vx;
    s.y += s.vy;

    if(s.x < -20 || s.x > sw + 20 || s.y < -20 || s.y > sh + 20){
      Object.assign(s, makeSpark());
    }

    sCtx.shadowBlur = 12;
    sCtx.shadowColor = s.color;
    sCtx.fillStyle = s.color;
    sCtx.beginPath();
    sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sCtx.fill();
  }

  requestAnimationFrame(drawSparks);
}
requestAnimationFrame(drawSparks);
</script>

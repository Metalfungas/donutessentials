<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Donut Essentials - Downloads</title>

<style>
:root{
  --bg:#050000;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,140,40,0.18);
  --text:#fff3ea;
  --red:#ff3d00;
  --orange:#ff9800;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text);
  background:var(--bg);
}

/* background canvases */
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#lava{
  z-index:0;
}

#sparks{
  z-index:1;
  pointer-events:none;
}

.wrap{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:min(1050px,100%);
  padding:40px;
  border-radius:28px;
  border:1px solid var(--border);
  background:var(--card);
  backdrop-filter:blur(16px);
  box-shadow:0 20px 80px rgba(0,0,0,0.45);
  text-align:center;
}

h1{
  margin:0;
  font-size:clamp(2.4rem,5vw,4rem);
  font-weight:900;
  letter-spacing:0.02em;
  background:linear-gradient(90deg,var(--orange),var(--red));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 30px rgba(255,120,0,0.12);
}

.sub{
  margin-top:8px;
  margin-bottom:22px;
  opacity:0.72;
  letter-spacing:0.28em;
  font-size:0.82rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:18px;
}

.mod{
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,160,70,0.18);
  background:rgba(0,0,0,0.22);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.mod:hover{
  transform:translateY(-5px);
  box-shadow:0 16px 40px rgba(255,110,0,0.12);
  border-color:rgba(255,160,70,0.34);
}

.mod img{
  width:100%;
  height:140px;
  display:block;
  object-fit:cover;
}

.mod .info{
  padding:14px 12px;
  font-weight:800;
  letter-spacing:0.02em;
}

/* loading bar */
.loader{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:7px;
  z-index:5;
  background:rgba(255,255,255,0.05);
}

.bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--red),var(--orange));
  box-shadow:0 0 18px rgba(255,120,0,0.7);
  transition:width .08s linear;
}

@media (max-width: 850px){
  body{
    overflow:auto;
  }
  .wrap{
    min-height:100vh;
    height:auto;
    align-items:flex-start;
    padding-top:26px;
    padding-bottom:26px;
  }
  .grid{
    grid-template-columns:1fr;
  }
}
</style>

<body>

<canvas id="lava"></canvas>
<canvas id="sparks"></canvas>

<div class="wrap">
  <div class="card">
    <h1>Downloads</h1>
    <div class="sub">DONUT ESSENTIALS</div>

    <div class="grid">
      <div class="mod" onclick="downloadFile('1.png')">
        <img src="1.png" alt="Download 1">
        <div class="info">PvP Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('2.png')">
        <img src="2.png" alt="Download 2">
        <div class="info">FPS Boost</div>
      </div>

      <div class="mod" onclick="downloadFile('3.png')">
        <img src="3.png" alt="Download 3">
        <div class="info">Client Mods</div>
      </div>

      <div class="mod" onclick="downloadFile('4.png')">
        <img src="4.png" alt="Download 4">
        <div class="info">HUD Pack</div>
      </div>

      <div class="mod" onclick="downloadFile('5.png')">
        <img src="5.png" alt="Download 5">
        <div class="info">Utility Mods</div>
      </div>
    </div>
  </div>
</div>

<div class="loader"><div class="bar" id="bar"></div></div>

<script>
const bar = document.getElementById("bar");

function downloadFile(file){
  let progress = 0;
  bar.style.width = "0%";

  const interval = setInterval(() => {
    progress += Math.random() * 10 + 2;

    if(progress >= 100){
      progress = 100;
      clearInterval(interval);

      const a = document.createElement("a");
      a.href = file;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => {
        bar.style.width = "0%";
      }, 500);
    }

    bar.style.width = progress + "%";
  }, 65);
}

/* =========================
   LAVA FLOW BACKGROUND
========================= */
const lavaCanvas = document.getElementById("lava");
const lavaCtx = lavaCanvas.getContext("2d");

let lw = 0, lh = 0, dpr = 1;

function resizeLava(){
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  lw = window.innerWidth;
  lh = window.innerHeight;
  lavaCanvas.width = Math.floor(lw * dpr);
  lavaCanvas.height = Math.floor(lh * dpr);
  lavaCanvas.style.width = lw + "px";
  lavaCanvas.style.height = lh + "px";
  lavaCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeLava);
resizeLava();

function drawLava(t){
  const time = t * 0.001;

  // dark base
  const bg = lavaCtx.createLinearGradient(0, 0, lw, lh);
  bg.addColorStop(0, "#060000");
  bg.addColorStop(0.45, "#130202");
  bg.addColorStop(1, "#250603");
  lavaCtx.fillStyle = bg;
  lavaCtx.fillRect(0, 0, lw, lh);

  // moving molten bands
  for(let y = -40; y < lh + 80; y += 16){
    const wave1 = Math.sin(time * 1.15 + y * 0.018) * 18;
    const wave2 = Math.sin(time * 0.75 + y * 0.028) * 10;
    const drift = wave1 + wave2;

    const grad = lavaCtx.createLinearGradient(0, y - 30, 0, y + 30);
    grad.addColorStop(0, "rgba(255,50,0,0)");
    grad.addColorStop(0.45, "rgba(255,61,0,0.04)");
    grad.addColorStop(0.5, "rgba(255,152,0,0.18)");
    grad.addColorStop(0.55, "rgba(255,61,0,0.04)");
    grad.addColorStop(1, "rgba(255,50,0,0)");

    lavaCtx.beginPath();
    for(let x = -60; x <= lw + 60; x += 60){
      const ripple = Math.sin(time * 1.4 + x * 0.015 + y * 0.01) * 10
                   + Math.cos(time * 0.9 + x * 0.02 - y * 0.008) * 6;
      const yy = y + drift + ripple;
      if(x === -60) lavaCtx.moveTo(x, yy);
      else lavaCtx.lineTo(x, yy);
    }
    lavaCtx.strokeStyle = grad;
    lavaCtx.lineWidth = 28;
    lavaCtx.lineJoin = "round";
    lavaCtx.lineCap = "round";
    lavaCtx.stroke();
  }

  // hot flowing blobs
  lavaCtx.globalCompositeOperation = "lighter";
  for(let i = 0; i < 18; i++){
    const px = (i / 18) * lw + Math.sin(time * 0.8 + i * 1.4) * 40;
    const py = lh * 0.55 + Math.sin(time * 1.6 + i * 0.9) * 80 + Math.cos(time * 1.1 + i) * 35;
    const radius = 80 + Math.sin(time * 2 + i) * 18;

    const glow = lavaCtx.createRadialGradient(px, py, 0, px, py, radius);
    glow.addColorStop(0, "rgba(255,190,70,0.32)");
    glow.addColorStop(0.35, "rgba(255,120,0,0.18)");
    glow.addColorStop(0.7, "rgba(255,60,0,0.07)");
    glow.addColorStop(1, "rgba(255,60,0,0)");

    lavaCtx.fillStyle = glow;
    lavaCtx.beginPath();
    lavaCtx.arc(px, py, radius, 0, Math.PI * 2);
    lavaCtx.fill();
  }
  lavaCtx.globalCompositeOperation = "source-over";

  // dark vignette
  const vignette = lavaCtx.createRadialGradient(
    lw / 2, lh / 2, Math.min(lw, lh) * 0.2,
    lw / 2, lh / 2, Math.max(lw, lh) * 0.75
  );
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, "rgba(0,0,0,0.48)");
  lavaCtx.fillStyle = vignette;
  lavaCtx.fillRect(0, 0, lw, lh);

  requestAnimationFrame(drawLava);
}
requestAnimationFrame(drawLava);

/* =========================
   EMBER PARTICLES
========================= */
const sparksCanvas = document.getElementById("sparks");
const sparksCtx = sparksCanvas.getContext("2d");

let sw = 0, sh = 0, sp = [];
const mouse = { x: -9999, y: -9999 };

function resizeSparks(){
  const d = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  sw = window.innerWidth;
  sh = window.innerHeight;
  sparksCanvas.width = Math.floor(sw * d);
  sparksCanvas.height = Math.floor(sh * d);
  sparksCanvas.style.width = sw + "px";
  sparksCanvas.style.height = sh + "px";
  sparksCtx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", resizeSparks);
resizeSparks();

window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function makeSpark(){
  const orange = Math.random() > 0.5;
  return {
    x: Math.random() * sw,
    y: Math.random() * sh,
    vx: (Math.random() - 0.5) * 1.4,
    vy: (Math.random() - 0.5) * 1.4,
    r: Math.random() * 2.4 + 0.4,
    color: orange ? "rgba(255,152,0,0.78)" : "rgba(255,61,0,0.78)"
  };
}

function initSparks(){
  sp = [];
  for(let i = 0; i < 160; i++) sp.push(makeSpark());
}
initSparks();

function drawSparks(){
  sparksCtx.clearRect(0, 0, sw, sh);

  for(const s of sp){
    const dx = s.x - mouse.x;
    const dy = s.y - mouse.y;
    const dist = Math.hypot(dx, dy);

    if(dist < 160){
      s.x += dx * 0.008;
      s.y += dy * 0.008;
    }

    s.x += s.vx;
    s.y += s.vy;

    if(s.x < -20 || s.x > sw + 20 || s.y < -20 || s.y > sh + 20){
      Object.assign(s, makeSpark());
    }

    sparksCtx.shadowBlur = 12;
    sparksCtx.shadowColor = s.color;
    sparksCtx.fillStyle = s.color;
    sparksCtx.beginPath();
    sparksCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sparksCtx.fill();
  }

  requestAnimationFrame(drawSparks);
}
requestAnimationFrame(drawSparks);
</script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Donut Essentials - Downloads</title>

<style>
:root{
  --bg1:#120606;
  --bg2:#250b08;
  --red:#ff4d2e;
  --orange:#ff9a2f;
  --text:#fff3ea;
  --border:rgba(255,160,80,0.2);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,154,47,0.15), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(255,77,46,0.12), transparent 35%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* sparks */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:2;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(820px,100%);
  padding:42px;
  border-radius:24px;
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  background:rgba(255,255,255,0.06);
  text-align:center;
}

h1{
  margin:0 0 10px;
  font-size:3rem;
  background:linear-gradient(90deg,var(--orange),var(--red));
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  opacity:0.7;
  letter-spacing:0.2em;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.btn{
  padding:14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
  letter-spacing:0.08em;
  color:white;
  background:linear-gradient(135deg,var(--red),var(--orange));
  transition:0.2s;
  box-shadow:0 10px 25px rgba(255,80,40,0.25);
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.btn:active{
  transform:scale(0.98);
}

/* LOADING BAR */
.loader{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.06);
  z-index:5;
  overflow:hidden;
}

.bar{
  height:100%;
  width:40%;
  background:linear-gradient(90deg,var(--red),var(--orange));
  box-shadow:0 0 20px rgba(255,120,40,0.6);
  animation:load 2s infinite ease-in-out;
}

@keyframes load{
  0%{transform:translateX(-100%);}
  50%{transform:translateX(150%);}
  100%{transform:translateX(-100%);}
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<canvas id="sparks"></canvas>

<div class="wrap">
  <div class="card">
    <h1>Downloads</h1>
    <div class="sub">DONUT ESSENTIALS</div>

    <div class="grid">
      <button class="btn" onclick="window.location.href='file1.zip'">Download 1</button>
      <button class="btn" onclick="window.location.href='file2.zip'">Download 2</button>
      <button class="btn" onclick="window.location.href='file3.zip'">Download 3</button>
      <button class="btn" onclick="window.location.href='file4.zip'">Download 4</button>
      <button class="btn" onclick="window.location.href='file5.zip'">Download 5</button>
    </div>
  </div>
</div>

<div class="loader"><div class="bar"></div></div>

<script>
const c=document.getElementById("sparks");
const ctx=c.getContext("2d");

let w,h,particles=[];

function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}

function spark(){
  return{
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-0.5)*1.2,
    vy:(Math.random()-0.5)*1.2,
    r:Math.random()*2+0.5,
    life:100+Math.random()*120
  };
}

function init(){
  particles=[];
  for(let i=0;i<90;i++) particles.push(spark());
}

function draw(){
  ctx.clearRect(0,0,w,h);

  for(let p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    if(p.life<=0){
      Object.assign(p,spark());
    }

    ctx.beginPath();
    ctx.fillStyle="rgba(255,140,60,0.8)";
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

window.onresize=()=>{resize();init();}
resize();init();draw();
</script>

</body>
</html>
